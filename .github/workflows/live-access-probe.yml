name: Live access probe (manual, read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ESPN access (no retries, no data publication)
        run: python src/probe_live_access.py --environment github-runner

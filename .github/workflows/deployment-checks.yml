name: Deployment checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dashboard/**'
      - 'cloud/**'
      - 'models/**'
      - 'results/player_intelligence/**'
      - 'results/season_intelligence/**'
      - 'requirements.txt'
      - 'requirements-deployment.txt'
      - '.github/workflows/deployment-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/courtvision-matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-deployment.txt
            cloud/requirements.txt
      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -r cloud/requirements.txt
          python -m pip check
      - name: Unit regressions
        run: python -m unittest discover -s src -p 'test_*.py'
      - name: Frozen model and offline published UI
        run: |
          python src/validate_deployment.py
          python src/validate_deployment.py --entrypoint cloud/app.py
      - name: Compile and inspect changes
        run: |
          python -m compileall -q src dashboard cloud
          git diff --check
          git diff --exit-code

name: Update Season Intelligence (manual diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-season-intelligence
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Courtvision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-updater.txt

      - name: Install updater dependencies
        run: python -m pip install -r requirements-updater.txt

      - name: Refresh team and player intelligence independently
        id: refresh
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python src/update_intelligence.py

      - name: Validate early-season intelligence
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest
          src/test_early_season_intelligence.py
          src/test_player_rating.py
          src/test_update_player_intelligence.py
          src/test_player_career.py
          src/test_backfill_player_intelligence.py
          src/test_update_intelligence.py
          src/test_run_nightly_intelligence.py

      - name: Check generated diff
        run: git diff --check

      - name: Commit updated artifacts
        run: |
          for path in \
            results/season_intelligence/2026-27_team_rating_games_v1.csv \
            results/season_intelligence/2026-27_team_summary_v1.csv \
            results/season_intelligence/2026-27_update_status_v1.json \
            results/player_intelligence/2026-27_player_game_v1.csv \
            results/player_intelligence/2026-27_player_ratings_v1.csv
          do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new completed games to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update 2026-27 season intelligence"
          git pull --rebase origin main
          git push

      - name: Report incomplete refresh
        if: always() && steps.refresh.outcome == 'failure'
        run: |
          echo "::error::An intelligence refresh was incomplete. Successful pipeline data and health status were retained; missing games will be retried."
          exit 1

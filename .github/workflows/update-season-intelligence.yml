name: Update Season Intelligence

on:
  schedule:
    - cron: "0 16-23 * * *"
      timezone: "America/Los_Angeles"
    - cron: "0 1 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-season-intelligence
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Courtvision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-updater.txt

      - name: Install updater dependencies
        run: python -m pip install -r requirements-updater.txt

      - name: Check official NBA CDN availability
        run: |
          python - <<'PY'
          import requests
          urls = {
            'schedule': 'https://cdn.nba.com/static/json/staticData/scheduleLeagueV2_1.json',
            'box': 'https://cdn.nba.com/static/json/liveData/boxscore/boxscore_0022600006.json',
            'pbp': 'https://cdn.nba.com/static/json/liveData/playbyplay/playbyplay_0022600006.json',
          }
          for name, url in urls.items():
              try:
                  response = requests.get(url, timeout=10)
                  print(name, response.status_code, flush=True)
                  if response.ok:
                      data = response.json()
                      print('keys', list(data), flush=True)
                      if name == 'schedule':
                          schedule = data.get('leagueSchedule', {})
                          print('season', schedule.get('seasonYear'), 'sample', str(schedule.get('gameDates', [])[:1])[:3000], flush=True)
                      elif name == 'pbp':
                          print('sample', data.get('game', {}).get('actions', [])[:1], flush=True)
                      else:
                          print('sample', str(data.get('game', {}).get('homeTeam', {}))[:3000], flush=True)
              except Exception as error:
                  print(name, type(error).__name__, str(error), flush=True)
          PY

      - name: Refresh team and player intelligence independently
        id: refresh
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python src/update_intelligence.py

      - name: Validate early-season intelligence
        env:
          PYTHONPATH: src
        run: >-
          python -m unittest
          src/test_early_season_intelligence.py
          src/test_player_rating.py
          src/test_update_player_intelligence.py
          src/test_player_career.py
          src/test_backfill_player_intelligence.py
          src/test_update_intelligence.py

      - name: Check generated diff
        run: git diff --check

      - name: Commit updated artifacts
        run: |
          for path in \
            results/season_intelligence/2026-27_team_rating_games_v1.csv \
            results/season_intelligence/2026-27_team_summary_v1.csv \
            results/season_intelligence/2026-27_update_status_v1.json \
            results/player_intelligence/2026-27_player_game_v1.csv \
            results/player_intelligence/2026-27_player_ratings_v1.csv
          do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new completed games to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update 2026-27 season intelligence"
          git pull --rebase origin main
          git push

      - name: Report incomplete refresh
        if: always() && steps.refresh.outcome == 'failure'
        run: |
          echo "::error::An intelligence refresh was incomplete. Successful pipeline data and health status were retained; missing games will be retried."
          exit 1
